baseline_conflict: |
  reolink-http-snapshot.md:54 states 'Returns BGR numpy array, same format as Camera.snapshot().data'.
claims:
  - pywaggle's `Camera` defaults to `format=RGB` and `ImageSample.__init__` applies `cv2.cvtColor(data, COLOR_BGR2RGB)` on construction, so `snapshot.data[...,0]` is RED — a plugin that reasons about `snapshot.data` as if it were raw cv2 BGR publishes silently swapped R/B channels.
